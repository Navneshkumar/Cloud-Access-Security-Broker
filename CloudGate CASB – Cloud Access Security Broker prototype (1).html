<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CloudGate CASB – Cloud Access Security Broker prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<style>
:root{
  --bg:#EDF0F5;--panel:#FFFFFF;--panel2:#F5F7FA;--line:#DCE1EA;--line2:#C7CEDC;
  --text:#17203B;--muted:#56607E;--faint:#848DA8;
  --brand:#3B3DBF;--brand-ink:#FFFFFF;--brand-soft:#E8E8FA;
  --crit:#C2203A;--crit-soft:#FBE4E8;--high:#C9601A;--high-soft:#FCEADC;
  --med:#9A7300;--med-soft:#FAF0CC;--low:#1F7F5A;--low-soft:#DBF1E6;
  --hover:#F0F2F8;--shadow:0 1px 2px rgba(23,32,59,.06),0 6px 20px rgba(23,32,59,.05);
  --scrim:rgba(15,20,40,.38);
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1322;--panel:#151B2E;--panel2:#1A2137;--line:#252E48;--line2:#33405F;
    --text:#E3E7F3;--muted:#9AA4C4;--faint:#6D779A;
    --brand:#9395FF;--brand-ink:#0F1330;--brand-soft:#252A5C;
    --crit:#FF6A80;--crit-soft:#3A1622;--high:#FF9C5A;--high-soft:#3A2515;
    --med:#EFC54C;--med-soft:#352C10;--low:#4FD3A1;--low-soft:#12322A;
    --hover:#1D2540;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);--scrim:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1322;--panel:#151B2E;--panel2:#1A2137;--line:#252E48;--line2:#33405F;
  --text:#E3E7F3;--muted:#9AA4C4;--faint:#6D779A;
  --brand:#9395FF;--brand-ink:#0F1330;--brand-soft:#252A5C;
  --crit:#FF6A80;--crit-soft:#3A1622;--high:#FF9C5A;--high-soft:#3A2515;
  --med:#EFC54C;--med-soft:#352C10;--low:#4FD3A1;--low-soft:#12322A;
  --hover:#1D2540;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);--scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--panel)}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:22px}h2{font-size:16px}h3{font-size:14px}
p{margin:0}
a{color:var(--brand)}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
/* sidebar */
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100dvh - env(safe-area-inset-top,0px));display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);padding:16px 12px;overflow:auto;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--brand);display:grid;place-items:center;color:var(--brand-ink)}
.brand b{display:block;font-size:15px;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-group{font-size:12px;color:var(--faint);padding:14px 10px 6px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:none;border-radius:8px;cursor:pointer;color:var(--muted);text-align:left;font-weight:500}
.nav button:hover{background:var(--hover);color:var(--text)}
.nav button[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
.nav svg{width:18px;height:18px;flex:none}
.nav .count{margin-left:auto;font-size:11.5px;font-weight:600;background:var(--crit);color:#fff;border-radius:10px;padding:1px 7px}
.side-foot{margin-top:auto;padding:12px 8px 4px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:grid;gap:8px}
.demo-pill{display:flex;gap:8px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px}
.demo-pill i{width:8px;height:8px;border-radius:50%;background:var(--low);margin-top:5px;flex:none}
/* topbar */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:10px;padding:10px 22px;background:var(--panel);border-bottom:1px solid var(--line)}
.icon-btn.menu-btn{display:none}
[hidden]{display:none!important}
.search{position:relative;flex:1;max-width:460px}
.search input{width:100%;height:36px;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:0 12px 0 34px}
.search>svg{position:absolute;left:10px;top:9px;width:18px;height:18px;color:var(--faint)}
.search kbd{position:absolute;right:8px;top:8px;font:11px "IBM Plex Mono",monospace;border:1px solid var(--line2);border-radius:5px;padding:1px 6px;color:var(--faint)}
.results{position:absolute;top:42px;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:380px;overflow:auto;display:none;z-index:50}
.results.open{display:block}
.results button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:9px 12px;text-align:left;cursor:pointer}
.results button:hover,.results button.active{background:var(--hover)}
.results small{color:var(--faint);margin-left:auto;font-size:11.5px}
.top-spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:9px;border:1px solid var(--line2);background:var(--panel);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--line2))}
.btn.sm{height:28px;padding:0 10px;font-size:13px;border-radius:7px}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--hover)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;border:1px solid var(--line2);background:var(--panel);cursor:pointer;position:relative}
.icon-btn:hover{background:var(--hover)}
.icon-btn svg{width:18px;height:18px}
.badge-dot{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--crit);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 5px}
.live{display:flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:9px;padding:3px 3px 3px 10px;height:34px}
.live .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.live.on .dot{background:var(--low);box-shadow:0 0 0 0 var(--low);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--low) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.live select{height:26px;border:0;background:var(--panel2);border-radius:6px;padding:0 4px;font-size:12.5px}
.newpill{display:none;align-items:center;gap:6px;height:30px;border-radius:15px;padding:0 12px;background:var(--brand-soft);color:var(--brand);border:0;font-weight:600;font-size:12.5px;cursor:pointer}
.newpill.show{display:inline-flex}
/* content */
.content{padding:22px;display:grid;gap:18px;max-width:1500px;width:100%}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-head p{color:var(--muted);margin-top:4px;max-width:70ch}
.page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:center;gap:10px;padding:14px 16px 0}
.panel-h p{color:var(--muted);font-size:12.5px}
.panel-h .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.panel-b{padding:14px 16px 16px}
.grid{display:grid;gap:18px}
.g-kpi{grid-template-columns:repeat(5,minmax(0,1fr))}
.g-2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{padding:14px 16px;display:grid;gap:4px;align-content:start}
.kpi .lbl{color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:28px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--faint)}
.kpi .sub b{font-weight:600}
.chart-box{position:relative;height:240px}
.chart-box.sm{height:200px}
.chart-fallback{display:grid;place-items:center;height:100%;color:var(--faint);font-size:13px}
/* gate hero */
.gate{position:relative;overflow:hidden}
.gate-head{display:flex;align-items:flex-start;gap:16px;padding:16px 18px 0;flex-wrap:wrap}
.gate-head h2{font-size:18px}
.gate-head p{color:var(--muted);font-size:13px;margin-top:3px;max-width:62ch}
.gate-stats{margin-left:auto;display:flex;gap:22px}
.gate-stats div{display:grid}
.gate-stats b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.gate-stats span{font-size:12px;color:var(--muted)}
.gate svg{display:block;width:100%;height:auto}
.gate .lane{fill:none;stroke:var(--line2);stroke-width:1.2}
.gate .node rect{fill:var(--panel2);stroke:var(--line2)}
.gate .node text{fill:var(--text);font-size:12.5px}
.gate .node .s{fill:var(--faint);font-size:11px}
.gate .core rect{fill:var(--brand)}
.gate .core text{fill:var(--brand-ink)}
.gate .ripple{fill:none;stroke:var(--crit);stroke-width:2}
.gate-foot{display:flex;gap:10px;align-items:center;padding:0 18px 16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.sev-critical{color:var(--crit);background:var(--crit-soft)}
.sev-high{color:var(--high);background:var(--high-soft)}
.sev-medium{color:var(--med);background:var(--med-soft)}
.sev-low{color:var(--low);background:var(--low-soft)}
.sev-none{color:var(--muted);background:var(--panel2)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500;background:var(--panel2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.brand{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
.tag.ok{background:var(--low-soft);border-color:transparent;color:var(--low)}
.tag.warn{background:var(--med-soft);border-color:transparent;color:var(--med)}
.tag.bad{background:var(--crit-soft);border-color:transparent;color:var(--crit)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500}
.status i{width:8px;height:8px;border-radius:50%}
/* tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:default}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--hover)}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.who{display:flex;align-items:center;gap:9px;min-width:0}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;flex:none;color:#fff}
.who b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--faint);font-size:11.5px;display:block;white-space:nowrap}
.appdot{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:10.5px;font-weight:700;flex:none;color:#fff}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.small{font-size:12.5px}
.nowrap{white-space:nowrap}
/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.field{display:grid;gap:5px}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.inp,.sel{height:32px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);padding:0 10px;min-width:0}
.sel{padding-right:6px}
textarea.inp{height:auto;padding:10px;resize:vertical;line-height:1.5}
.inp.grow{flex:1;min-width:180px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);height:30px;padding:0 11px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line2)}
.seg button[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.pager{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.pager .r{margin-left:auto;display:flex;gap:6px}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);margin-bottom:4px}
/* switch */
.switch{position:relative;width:36px;height:20px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;background:var(--line2);border-radius:10px;transition:background .15s}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked+span{background:var(--brand)}
.switch input:checked+span::after{transform:translateX(16px)}
.switch input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
/* lists */
.list{display:grid}
.li{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li.click{cursor:pointer}
.li.click:hover{background:var(--hover)}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .d{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;border-radius:3px}
/* rules */
.rule{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;padding:14px 16px;border-top:1px solid var(--line);align-items:start}
.rule:first-child{border-top:0}
.rule .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.rule .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.rule.off{opacity:.6}
.params{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;padding:10px;background:var(--panel2);border-radius:10px}
.params .inp{width:110px}
.params .inp.wide{width:280px}
.rid{font:500 11.5px "IBM Plex Mono",monospace;color:var(--faint)}
/* drawer & modal */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:70;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--panel);z-index:80;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none}
.drawer-h{display:flex;gap:10px;align-items:flex-start;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer-h .grow{flex:1;min-width:0}
.drawer-b{overflow:auto;padding:18px 20px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-content:start}
.drawer-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.sec h3{margin-bottom:8px}
.kv{display:grid;grid-template-columns:140px minmax(0,1fr);gap:7px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.why{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.why table td,.why table th{padding:8px 10px}
.check{color:var(--crit);font-weight:700}
.callout{background:var(--brand-soft);color:var(--text);border-radius:10px;padding:12px 14px;font-size:13px}
.callout b{color:var(--brand)}
.steps{margin:0;padding-left:20px;display:grid;gap:5px}
.timeline{display:grid;gap:0;border-left:2px solid var(--line);margin-left:6px}
.timeline div{position:relative;padding:4px 0 10px 16px;font-size:13px}
.timeline div::before{content:"";position:absolute;left:-6px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--line2)}
.timeline div.hit::before{border-color:var(--crit);background:var(--crit)}
.timeline small{color:var(--faint);display:block}
pre.json{margin:0;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;max-height:280px;font:12px/1.55 "IBM Plex Mono",monospace}
.note{border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px}
.note small{color:var(--faint);display:block;margin-bottom:2px}
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:90;pointer-events:none;padding:16px}
.modal .box{width:min(640px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:var(--panel);border-radius:16px;border:1px solid var(--line);box-shadow:var(--shadow);transform:translateY(10px);opacity:0;transition:.2s;pointer-events:none}
.modal.open .box{transform:none;opacity:1;pointer-events:auto}
.box-h{padding:18px 20px 0;display:flex;gap:10px}
.box-b{padding:16px 20px;display:grid;gap:14px}
.box-f{padding:0 20px 18px;display:flex;justify-content:flex-end;gap:8px}
.cond{display:grid;grid-template-columns:1.2fr 1fr 1.2fr auto;gap:8px;align-items:center}
/* toasts */
.toasts{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:100;width:min(360px,calc(100% - 36px))}
.toast{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:13px;animation:tin .25s ease}
.toast b{display:block}
.toast .x{margin-left:auto;border:0;background:none;cursor:pointer;color:var(--faint);padding:0 2px}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
/* dlp */
.scan-out{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;white-space:pre-wrap;font:12.5px/1.65 "IBM Plex Mono",monospace;max-height:320px;overflow:auto;overflow-wrap:anywhere}
mark{border-radius:4px;padding:0 2px;color:inherit}
mark.critical{background:var(--crit-soft);box-shadow:inset 0 -2px 0 var(--crit)}
mark.high{background:var(--high-soft);box-shadow:inset 0 -2px 0 var(--high)}
mark.medium{background:var(--med-soft);box-shadow:inset 0 -2px 0 var(--med)}
mark.low{background:var(--low-soft);box-shadow:inset 0 -2px 0 var(--low)}
.verdict{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}

.res-fail{color:var(--crit);font-weight:600}

.ctl-cov{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}

.hide-sm{}

      hits.push({ruleId:r.id, ruleName:r.name, cat:r.cat, sev:res.sev || cfg.sev, mode:cfg.mode, summary:res.summary, evidence:res.evidence, related:res.related || [], rec:r.rec, mitre:r.mitre});
    }
    for (const cr of customs){
      if (!cr.enabled || !cr.conds.length) continue;
      if (!cr.conds.every(cd => evalCond(cd, e, c))) continue;
      if (c.cool(cr.id, e.user, e.ts, (cr.cooldownMin || 30)*MIN)) continue;
      hits.push({ruleId:cr.id, ruleName:cr.name, cat:'Custom', sev:cr.sev, mode:cr.mode || 'monitor', summary:`${cr.name}: ${ACTION_LABEL[e.action] || e.action} on ${app.name}`,
        evidence:cr.conds.map(cd => [FIELD_LABEL[cd.field], String(FIELD_GET[cd.field](e, c)), `${OPS[cd.op]} ${cd.value}`]), related:[], rec:cr.rec ? [cr.rec] : ['Review the event and decide whether the rule needs tuning'], mitre:'—'});
    }
    if (e.action === 'login') st.last[e.user] = {ts:e.ts, city:e.city, country:e.country, lat:e.lat, lon:e.lon, id:e.id};
    return hits;
  }
  return {process};
}
function toAlert(e, h){
  const id = h.ruleId + ':' + e.id; const m = P.alertMeta[id] || {};
  return {id, ts:e.ts, eventId:e.id, user:e.user, app:e.app, ruleId:h.ruleId, ruleName:h.ruleName, cat:h.cat, sev:h.sev, mode:h.mode,
    summary:h.summary, evidence:h.evidence, related:h.related, rec:h.rec, mitre:h.mitre, status:m.status || 'open', assignee:m.assignee || 'Unassigned', notes:m.notes || []};
}
function runAll(){
  const t0 = performance.now();
  S.events.sort((a, b) => a.ts - b.ts);
  const eng = createEngine(); S.engine = eng; S.alerts = []; S.alertsByEvent = new Map();
  for (const e of S.events){ const hits = eng.process(e); e.blocked = false; for (const h of hits){ const a = toAlert(e, h); S.alerts.push(a); if (h.mode === 'block') e.blocked = true; if (!S.alertsByEvent.has(e.id)) S.alertsByEvent.set(e.id, []); S.alertsByEvent.get(e.id).push(a); } }
  S.alerts.sort((a, b) => b.ts - a.ts);
  S.lastRunMs = performance.now() - t0;
}
function ingestLive(e){
  const hits = S.engine.process(e); S.events.push(e); const out = [];
  for (const h of hits){ const a = toAlert(e, h); S.alerts.unshift(a); out.push(a); if (h.mode === 'block') e.blocked = true; if (!S.alertsByEvent.has(e.id)) S.alertsByEvent.set(e.id, []); S.alertsByEvent.get(e.id).push(a); }
  return out;
}
const eventSev = e => { const a = S.alertsByEvent.get(e.id); if (!a) return null; return a.reduce((m, x) => SEV_ORDER[x.sev] > SEV_ORDER[m] ? x.sev : m, 'low'); };

function userRisk(uid){

  for (const a of S.alerts) if (a.user === uid && a.ts >= since && isActive(a)) s += w[a.sev];
  return Math.min(100, s);
}

let searchIdx = -1;
function searchItems(q){
  q = q.trim().toLowerCase(); if (!q) return [];
  const out = [];
  USERS.forEach(u => { if ((u.name + ' ' + u.email + ' ' + u.dept).toLowerCase().includes(q)) out.push({type:'User', label:u.name, sub:u.dept, run:() => openUser(u.id)}); });
  Object.values(S.appById).forEach(a => { if (a.name.toLowerCase().includes(q)) out.push({type:'App', label:a.name, sub:a.cat, run:() => openApp(a.id)}); });
  RULES.forEach(r => { if ((r.name + ' ' + r.id).toLowerCase().includes(q)) out.push({type:'Rule', label:r.name, sub:r.id, run:() => { go('policies'); }}); });
  FILES.forEach(f => { if (f.name.toLowerCase().includes(q)) out.push({type:'File', label:f.name, sub:f.label, run:() => go('dlp')}); });
  S.alerts.slice(0, 400).forEach(a => { if ((a.ruleName + ' ' + a.summary + ' ' + a.id).toLowerCase().includes(q) && out.length < 40) out.push({type:'Alert', label:a.summary, sub:SEV_LABEL[a.sev], run:() => openAlert(a.id)}); });
  const ev = S.events.find(e => e.id.toLowerCase() === q); if (ev) out.unshift({type:'Event', label:ev.id + ' ' + ACTION_LABEL[ev.action], sub:fmtTime(ev.ts), run:() => openEvent(ev.id)});

}

      <g transform="translate(${cx - 13} ${cy - 46})" fill="none" stroke="var(--brand-ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2l10 4v7c0 6-4.2 10.5-10 13C7.2 23.5 3 19 3 13V6l10-4z"/><path d="M9 13l3 3 5-5"/></g>
      <text x="${cx}" y="${cy + 6}" text-anchor="middle" font-size="15" font-weight="600">CloudGate</text>
      <text x="${cx}" y="${cy + 24}" text-anchor="middle" font-size="11.5" opacity=".85">Normalise · Evaluate</text>
      <text x="${cx}" y="${cy + 40}" text-anchor="middle" font-size="11.5" opacity=".85">Log · Alert</text></g></svg>`;

function animateThroughGate(e, flagged){
  if (S.view !== 'overview' || !$('#gateDots') || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const u = S.userById[e.user]; const from = GATE.users.find(x => x.key === u.dept) || GATE.users[GATE.users.length - 1];
  const to = GATE.apps.find(x => x.key === e.app) || GATE.apps[GATE.apps.length - 1];
  const cx = GATE.W/2, cy = GATE.H/2; const ns = 'http://www.w3.org/2000/svg';
  const dot = document.createElementNS(ns, 'circle'); dot.setAttribute('r', flagged ? 6 : 4.5); dot.setAttribute('fill', flagged ? 'var(--crit)' : 'var(--brand)');
  $('#gateDots').appendChild(dot);
  const kf = flagged
    ? [{transform:`translate(${from.x}px,${from.y}px)`, opacity:0}, {transform:`translate(${from.x + 20}px,${from.y}px)`, opacity:1, offset:.1}, {transform:`translate(${cx - 76}px,${cy}px)`, opacity:1, offset:.7}, {transform:`translate(${cx - 76}px,${cy}px)`, opacity:0}]
    : [{transform:`translate(${from.x}px,${from.y}px)`, opacity:0}, {transform:`translate(${from.x + 20}px,${from.y}px)`, opacity:1, offset:.08}, {transform:`translate(${cx}px,${cy}px)`, opacity:.9, offset:.5}, {transform:`translate(${to.x - 20}px,${to.y}px)`, opacity:1, offset:.92}, {transform:`translate(${to.x}px,${to.y}px)`, opacity:0}];
  const an = dot.animate(kf, {duration:flagged ? 1500 : 1900, easing:'ease-in-out'}); an.onfinish = () => dot.remove();
  if (flagged){
    setTimeout(() => { if (!$('#gateDots')) return; const r = document.createElementNS(ns, 'rect'); r.setAttribute('class', 'ripple'); r.setAttribute('x', cx - 70); r.setAttribute('y', cy - 62); r.setAttribute('width', 140); r.setAttribute('height', 124); r.setAttribute('rx', 18);
      $('#gateDots').appendChild(r); r.animate([{opacity:1, strokeWidth:2}, {opacity:0, strokeWidth:12}], {duration:900, easing:'ease-out'}).onfinish = () => r.remove(); }, 1000);
  }
}

function runSuite(){
  const sc = scenarios(); let tp = 0, fp = 0, fn = 0, events = 0; const t0 = performance.now();
  const res = sc.map(s => { const eng = createEngine({defaults:!S.lab.useCurrent}); const got = new Set(); s.events.forEach(e => { events++; eng.process(e).forEach(h => got.add(h.ruleId)); });
    const exp = new Set(s.expect); const sTp = [...got].filter(r => exp.has(r)).length; const sFp = [...got].filter(r => !exp.has(r)).length; const sFn = [...exp].filter(r => !got.has(r)).length;
    tp += sTp; fp += sFp; fn += sFn; return {...s, got:[...got], pass:!sFp && !sFn, sFp, sFn}; });
  const ms = performance.now() - t0;
  S.lab.last = {res, tp, fp, fn, ms, events, passed:res.filter(r => r.pass).length, precision:tp + fp ? tp/(tp + fp) : 1, recall:tp + fn ? tp/(tp + fn) : 1, at:Date.now(), mode:S.lab.useCurrent ? 'current' : 'default'};
  audit('Test suite run', `${S.lab.last.passed}/${res.length} passed`);
}
function runBench(){

    const eng = createEngine(); let alerts = 0; const t0 = performance.now(); evs.forEach(e => alerts += eng.process(e).length); const ms = performance.now() - t0;
    out.push({n, ms, rate:n/(ms/1000), alerts}); }
  S.lab.bench = out; audit('Benchmark run', out.map(o => `${o.n}: ${o.ms.toFixed(0)} ms`).join(', '));
}

    const byRule = {}; al.forEach(a => byRule[a.ruleName] = (byRule[a.ruleName] || 0) + 1); const topR = Object.entries(byRule).sort((a, b) => b[1] - a[1]).slice(0, 8);
    body.innerHTML = `<div class="panel-b" style="display:grid;gap:18px">
      <div class="grid g-kpi"><div class="kpi"><span class="lbl">Events analysed</span><span class="val">${fmtN(S.events.length)}</span></div><div class="kpi"><span class="lbl">Alerts raised</span><span class="val">${fmtN(al.length)}</span></div><div class="kpi"><span class="lbl">Triaged</span><span class="val">${al.length ? Math.round(resolved/al.length*100) : 0}%</span><span class="sub">resolved or false positive</span></div><div class="kpi"><span class="lbl">Critical alerts</span><span class="val" style="color:var(--crit)">${al.filter(a => a.sev === 'critical').length}</span></div><div class="kpi"><span class="lbl">Control coverage</span><span class="val">${ctl.filter(c => c.covered).length}/${ctl.length}</span></div></div>
      <div class="grid g-2e"><div><h2 style="margin-bottom:10px">Alerts per day by severity</h2><div class="chart-box"><canvas id="cStack"></canvas></div></div><div><h2 style="margin-bottom:10px">Most frequent rules</h2><div class="chart-box"><canvas id="cRules"></canvas></div></div></div></div>`;
    const C = chartColors();
    mkChart('cStack', {type:'bar', data:{labels:days.map(fmtDay), datasets:['critical','high','medium','low'].map((s, i) => ({label:SEV_LABEL[s], data:days.map(d => al.filter(a => a.sev === s && a.ts >= d && a.ts < d + DAY).length), backgroundColor:[C.crit, C.high, C.med, C.low][i], borderRadius:3}))},
      options:{scales:{x:{stacked:true, grid:{display:false}}, y:{stacked:true, beginAtZero:true, grid:{color:C.line}}}}});
    mkChart('cRules', {type:'bar', data:{labels:topR.map(x => x[0]), datasets:[{data:topR.map(x => x[1]), backgroundColor:C.brand, borderRadius:5}]}, options:{indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:{grid:{color:C.line}}, y:{grid:{display:false}}}}});
  } else if (tab === 'compliance'){
    body.innerHTML = `<div class="panel-b"><div class="callout">Indicative mapping of CloudGate policies to ISO/IEC 27001:2022 Annex A controls. It shows where the prototype produces supporting evidence; it does not certify compliance with any standard.</div></div>
      <div class="list">${ctl.map(c => `<div class="ctl-cov"><span class="mono">${c.id}</span><div><b style="font-weight:500">${esc(c.name)}</b><div class="faint small">${c.rules.map(r => r === '*log' ? 'Central event log' : r === '*workflow' ? 'Alert triage workflow' : `${r}${enabledIds.has(r) ? '' : ' (off)'}`).join(', ')}${c.cnt ? `, ${c.cnt} alerts as evidence` : ''}</div></div>${c.covered ? '<span class="tag ok">Covered</span>' : '<span class="tag bad">Gap</span>'}</div>`).join('')}</div>`;
  } else {
    body.innerHTML = P.audit.length ? `<div class="tbl-wrap"><table><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Detail</th></tr></thead><tbody>${P.audit.slice(0, 120).map(x => `<tr><td class="nowrap small">${fmtFull(x.ts)}</td><td class="small">${esc(x.actor)}</td><td>${esc(x.action)}</td><td class="small muted">${esc(x.detail)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty"><b>No changes recorded yet</b>Tune a policy, triage an alert or import a log and it will appear here.</div>';
  }
  $$('[data-tab]').forEach(b => b.onclick = () => { S.tab.reports = b.dataset.tab; vReports(); });
  $('#expAll').onclick = () => exportFile(`cloudgate-alerts-${isoDate(Date.now())}.csv`, alertsCsv(al));
  $('#expRep').onclick = () => exportFile(`cloudgate-weekly-report-${isoDate(Date.now())}.html`, reportHtml(ctl));
}
function reportHtml(ctl){
  const al = S.alerts; const k = kpis(); const row = a => `<tr><td>${fmtFull(a.ts)}</td><td>${SEV_LABEL[a.sev]}</td><td>${esc(a.ruleId)} ${esc(a.ruleName)}</td><td>${esc(S.userById[a.user].name)}</td><td>${esc(a.summary)}</td><td>${statusLbl[a.status][0]}</td></tr>`;
  return `<!doctype html><html><head><meta charset="utf-8"><title>CloudGate weekly report</title><style>body{font:14px/1.5 Arial,sans-serif;max-width:960px;margin:32px auto;padding:0 20px;color:#17203B}h1{margin:0}table{width:100%;border-collapse:collapse;margin:12px 0 24px}td,th{border-bottom:1px solid #DCE1EA;padding:6px 8px;text-align:left;font-size:13px}.k{display:flex;gap:28px;margin:18px 0}.k b{display:block;font-size:24px}</style></head><body>
  <h1>CloudGate weekly security report</h1><p>Meridian Tech (fictional demo data). Generated ${fmtFull(Date.now())}.</p>
  <div class="k"><div><b>${fmtN(S.events.length)}</b>events analysed</div><div><b>${al.length}</b>alerts raised</div><div><b>${k.active}</b>still open</div><div><b>${k.risky}</b>high-risk users</div><div><b>${k.exposed}</b>over-shared files</div></div>
  <h2>Critical and high alerts</h2><table><tr><th>Time</th><th>Severity</th><th>Rule</th><th>User</th><th>Summary</th><th>Status</th></tr>${al.filter(a => SEV_ORDER[a.sev] >= 3).map(row).join('')}</table>
  <h2>Control coverage (indicative, ISO/IEC 27001:2022 Annex A)</h2><table><tr><th>Control</th><th>Name</th><th>Status</th></tr>${ctl.map(c => `<tr><td>${c.id}</td><td>${esc(c.name)}</td><td>${c.covered ? 'Covered' : 'Gap'}</td></tr>`).join('')}</table>
  <p style="color:#56607E">Rule-based detections from a prototype running on simulated data. This report supports review and does not certify compliance.</p></body></html>`;
}

/* ============================================================
   Live simulation
   ============================================================ */
function liveEvent(o){ const e = mkEvent(Object.assign({ts:Date.now(), network:'corporate', ip:'10.2' + Math.floor(Math.random()*9) + '.' + Math.floor(Math.random()*255) + '.' + (1 + Math.floor(Math.random()*250))}, o)); e.src = 'live'; e.id = 'LV-' + String(++S.liveCount).padStart(5, '0'); return e; }
function scheduleScenario(){
  const r = Math.random(); const u = USERS[Math.floor(Math.random()*USERS.length)]; const q = S.queue;
  const pickDoc = l => { const d = DOCS.filter(x => !l || x[1] === l); const x = d[Math.floor(Math.random()*d.length)]; return {name:x[0], label:x[1]}; };
  if (r < .14){ for (let i = 0; i < 6; i++) q.push({user:u.id, app:u.apps[0], action:'login_failed', city:'Frankfurt', network:'anonymizer', ip:'185.220.102.' + (10 + i)}); }
  else if (r < .28) q.push({user:u.id, app:u.apps[0], action:'download', sizeMB:600 + Math.random()*2400, file:pickDoc('Confidential'), network:'home', device:{type:'Laptop', managed:false, os:'Windows 11'}});
  else if (r < .4) q.push({user:u.id, app:u.apps[0], action:'share_public', file:pickDoc(Math.random() < .5 ? 'Restricted' : 'Confidential')});
  else if (r < .54) q.push({user:u.id, app:['dropzap','pastevault','quickpdf'][Math.floor(Math.random()*3)], action:'upload', sizeMB:5 + Math.random()*300, file:pickDoc('Internal'), network:'home'});
  else if (r < .64) q.push({user:u.id, app:u.apps[0], action:'login', city:['Dubai','Toronto','Sydney','New York'][Math.floor(Math.random()*4)], network:'home'});
  else if (r < .74) q.push({user:u.id, app:u.apps[0], action:'share_external', target:u.name.split(' ')[0].toLowerCase() + '.personal@gmail.com', file:pickDoc('Confidential')});
  else if (r < .84) q.push({user:u.id, app:'gws', action:'oauth_grant', target:'QuickPDF Online', scopes:['files.readwrite.all','mail.read']});
  else if (r < .92) q.push({user:u.id, app:u.apps[0], action:'view', file:pickDoc('Restricted'), device:{type:'Mobile', managed:false, os:'Android 15'}, network:'home'});
  else for (let i = 0; i < 22; i++) q.push({user:u.id, app:u.apps[0], action:'delete', file:{name:`archive_${i}.pdf`, label:'Internal'}});
}
function benignEvent(){
  const u = USERS[Math.floor(Math.random()*USERS.length)]; const app = u.apps[Math.floor(Math.random()*u.apps.length)]; const r = Math.random();
  const d = DOCS[Math.floor(Math.random()*DOCS.length)]; const file = {name:d[0], label:d[1]};
  const action = r < .2 ? 'login' : r < .5 ? 'view' : r < .68 ? 'download' : r < .85 ? 'upload' : r < .95 ? 'share_internal' : 'delete';
  return {user:u.id, app, action, file:action === 'login' ? null : file, sizeMB:action === 'download' || action === 'upload' ? .2 + Math.random()*45 : null, target:action === 'share_internal' ? USERS[Math.floor(Math.random()*USERS.length)].email : null, network:Math.random() < .6 ? 'corporate' : 'home'};
}
function liveTick(){
  if (!S.queue.length && Math.random() < .16) scheduleScenario();
  const o = S.queue.length ? S.queue.shift() : benignEvent();
  if (o.file === undefined) o.file = null;
  const e = liveEvent(o); const alerts = ingestLive(e);
  animateThroughGate(e, alerts.length > 0);
  alerts.forEach(a => { S.unseen.push(a.id); if (SEV_ORDER[a.sev] >= 3) toast(a.ruleName, a.summary, a.sev); });
  updateBell(); if (alerts.length) renderNav();
  if (S.view === 'overview') updateOverviewLive(); else { S.newSince++; const p = $('#newPill'); p.textContent = `${S.newSince} new events, refresh view`; p.classList.add('show'); }
  S.liveTimer = setTimeout(liveTick, (900 + Math.random()*900) / S.speed);
}
function setLive(on){
  S.live = on; clearTimeout(S.liveTimer); $('#liveBox').classList.toggle('on', on); $('#liveBtn').textContent = on ? 'Pause' : 'Start'; $('#liveLabel').textContent = on ? 'Live feed on' : 'Live feed off';
  if (on){ audit('Live simulation started', `${S.speed}× speed`); S.liveTimer = setTimeout(liveTick, 300); }
  if (S.view === 'overview'){ const h = $('#gateHint'); if (h) h.textContent = on ? 'Live feed is running. Flagged requests stop at the gate.' : 'Start the live feed to watch simulated requests get inspected in real time.'; const f = $('#gateCta'); if (f) f.innerHTML = on ? '' : `<button class="btn sm primary" id="gateStart">${icon('play', 14)}Start live feed</button>`; const gs = $('#gateStart'); if (gs) gs.onclick = () => setLive(true); }
}
$('#liveBtn').onclick = () => setLive(!S.live);
$('#speed').onchange = e => { S.speed = +e.target.value; };

/* ============================================================
   Boot
   ============================================================ */
S.events = genHistory();
P.imported.forEach(e => S.events.push(e));
runAll();
const hash = (location.hash || '').replace('#', '');
S.view = VIEWS.find(v => v.id === hash) ? hash : 'overview';
renderNav(); render();
/* One orchestrated moment: replay a handful of recent events through the gate on load */
if (S.view === 'overview' && !matchMedia('(prefers-reduced-motion: reduce)').matches){
  const flaggedIds = new Set(S.alerts.map(a => a.eventId));
  const sample = S.events.slice(-60).filter((e, i) => i % 5 === 0).slice(-8);
  const crit = S.events.filter(e => flaggedIds.has(e.id)).slice(-3);
  [...sample.slice(0, 3), crit[0], ...sample.slice(3, 6), crit[1], ...sample.slice(6), crit[2]].filter(Boolean).forEach((e, i) => setTimeout(() => animateThroughGate(e, flaggedIds.has(e.id)), 400 + i*260));
}
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => Object.values(S.charts).forEach(c => c.resize()), 150); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!P.theme) render(); });
</script>
